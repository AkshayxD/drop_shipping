<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina | Curated Luxury</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <nav class="navbar">
        <div class="logo">LUMINA.</div>
        <div class="cart-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
        </div>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <h1>Redefine Your Standard.</h1>
            <p>Discover an exclusive curation of premium lifestyle pieces, designed to elevate your everyday.</p>
            <button class="cta-button" onclick="document.getElementById('collection').scrollIntoView({behavior: 'smooth'})">
                Explore Collection
            </button>
        </div>
        <div class="hero-glow"></div>
    </header>

    <section id="collection" class="collection-section">
        <h2 class="section-title">The Curated Collection</h2>
        <div class="product-grid" id="product-grid">
            <!-- Products injected by JS -->
        </div>
    </section>

    <!-- Checkout Modal -->
    <div id="checkout-modal" class="modal">
        <div class="modal-content glass-panel">
            <span class="close-btn">&times;</span>
            <div class="modal-body">
                <div class="modal-image-container">
                    <img id="modal-img" src="" alt="Product">
                </div>
                <div class="modal-details">
                    <h3 id="modal-title">Product Name</h3>
                    <p id="modal-price">₹0</p>
                    <p class="modal-description" id="modal-desc">Product description goes here.</p>
                    
                    <form id="order-form" name="Order Form">
                        <input type="hidden" id="form-product" name="Product" value="">
                        <input type="hidden" id="form-price" name="Price" value="">
                        
                        <div class="form-group">
                            <label for="customer-name">Full Name</label>
                            <input type="text" id="customer-name" name="Name" placeholder="Enter your name" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="customer-address">Delivery Address (with Pincode)</label>
                            <textarea id="customer-address" name="Address" placeholder="Enter full address for delivery" required></textarea>
                        </div>

                        <div class="button-group">
                            <button type="submit" id="submit-order-btn" class="checkout-button">
                                Confirm & Place Order
                            </button>
                        </div>
                    </form>
                    <p class="secure-note">Fast & secure shipping. Cash on Delivery available.</p>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Lumina. Curated Luxury.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
